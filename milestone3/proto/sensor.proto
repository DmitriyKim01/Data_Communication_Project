syntax = "proto3";

service SensorService {
  rpc TriggerCapture (TriggerRequest) returns (CaptureResponse);
  rpc GetSensorIds (EmptyRequest) returns (SensorIdsResponse);
}

message TriggerRequest {
  string sensor_id = 1;
}

message CaptureResponse {
  bytes image_data = 1;
}

message EmptyRequest {}

message SensorIdsResponse {
  repeated string ids = 1;
}
