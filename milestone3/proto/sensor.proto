syntax = "proto3";

package sensor;

service SensorService {
  // Trigger the sensor to capture an image
  rpc TriggerCapture (TriggerRequest) returns (CaptureResponse);
}
//Trigger sensor
message TriggerRequest {
  string sensor_id = 1;  
}
//Image data
message CaptureResponse {
  bytes image_data = 1;  
}
