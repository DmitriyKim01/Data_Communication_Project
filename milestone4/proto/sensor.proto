syntax = "proto3";
// Computer to Server
service SensorServer {
  rpc TriggerCapturePc (TriggerRequest) returns (CaptureResponse);
  rpc AddSensor (SensorInfo) returns (EmptyResponse);
  rpc GetSensorIds (SensorIdsRequest) returns (AvailableSensors);
  rpc SendPublicKeyToServer (PublicKeyRequest) returns (PublicKeyResponse);
  
  rpc EnableSensor (EnableSensorRequest) returns (EnableSensorResponse);
  rpc DisableSensor(DisableSensorRequest) returns (DisableSensorResponse);

}
// Server to Sensor
service SingleSensor {
    rpc TriggerCapture (TriggerRequest) returns (CaptureResponse);
    rpc EnableSensor (EnableSensorRequest) returns (EnableSensorResponse);
    rpc DisableSensor (DisableSensorRequest) returns (DisableSensorResponse);
    rpc SendPublicKeyToSensor (PublicKeyRequest) returns (PublicKeyResponse);
}

message PublicKeyRequest {
  string id = 1;
  bytes public_key = 2;
  string sensor_id = 3;
}

message PublicKeyResponse {
  string message = 1;
}

message TriggerRequest {
    string id = 1;
    string sensor_id = 2;
}

message CaptureResponse {
    bytes image_data = 1;
}

message EmptyResponse {}
message EmptyRequest {}  

message SensorInfo {
  string id = 1;
  string ip = 2;
  int32  port = 3;
}

message AvailableSensors {
  bytes ids = 1;  
}

message SensorIdsRequest {
  string id = 1;
}
message EnableSensorRequest {
    string sensor_id = 1;
}

message EnableSensorResponse {
    string status = 1;  
}

message DisableSensorRequest {
    string sensor_id = 1;
}

message DisableSensorResponse {
    string status = 1; 
}